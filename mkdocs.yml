theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.png

  # Включаем кнопку копирования кода
  features:
    - content.code.copy
    - navigation.indexes

  # Настройка тем (Автоматическая + Кнопка переключения)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

# Плагины: Умный поиск (RU+EN), Авто-навигация и Даты из Git
plugins:
  - search:
      lang:
        - ru
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

# Расширения Markdown (Табы, Спойлеры, Блоки кода)
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
