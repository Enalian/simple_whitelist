name: Deploy MkDocs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (for example, v101826)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version_tag || github.event.repository.default_branch }}

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Установка MkDocs и плагинов
        run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-git-revision-date-localized-plugin

      - name: Генерация документации API
        run: python mkdocs/emmylua_mkdocs.py -s lua/irn_whitelist/ -o docs --update-nav

      - name: Коммит обновленной документации
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ mkdocs.yml
          git commit -m "mkdocs: auto-updating API docs (new release)" || true
          git pull origin ${{ github.event.repository.default_branch }} --rebase
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Деплой сайта
        run: mkdocs gh-deploy --force
